<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦇</text></svg>">
  <title>Stars*</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --green:      #39ff6e;
      --green-glow: rgba(57,255,110,0.5);
      --white:      #f0f4ff;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      background: #000;
      font-family: 'Nunito', sans-serif;
    }

    /* ── BG Video — B&W, wakes when the installation goes live ── */
    #bg-video {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
      opacity: 0.34;
      filter: grayscale(1) brightness(0.62);
      transition: opacity 2.4s ease, filter 2.4s ease;
    }
    body.is-live #bg-video {
      opacity: 0.8;
      filter: grayscale(1) brightness(1) contrast(1.06);
    }

    /* ── Vignette — opens up once live ── */
    .overlay {
      position: fixed;
      inset: 0;
      z-index: 1;
      background: radial-gradient(ellipse at center,
        rgba(0,0,0,0.15) 0%,
        rgba(0,0,0,0.72) 100%
      );
      pointer-events: none;
      transition: background 2.4s ease;
    }
    body.is-live .overlay {
      background: radial-gradient(ellipse at center,
        rgba(0,0,0,0.08) 0%,
        rgba(0,0,0,0.58) 100%
      );
    }

    /* ── The Bloom — generative loader canvas ── */
    #viz {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      will-change: transform;
    }

    /* ══════════════════════════════════════
       DORMANT — the invitation
    ══════════════════════════════════════ */
    .invite {
      position: fixed;
      /* sits where the threshold button will appear — invitation becomes ENTER */
      top: 80%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      text-align: center;
      cursor: pointer;
      transition: opacity 0.9s ease, transform 0.9s cubic-bezier(0.16,1,0.3,1);
      animation: inviteIn 1.4s cubic-bezier(0.16,1,0.3,1) both;
    }
    @keyframes inviteIn {
      from { opacity: 0; transform: translate(-50%, calc(-50% + 14px)); }
      to   { opacity: 1; transform: translate(-50%, -50%); }
    }
    .invite-text {
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 8px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.82);
      text-shadow: 0 0 18px rgba(255,255,255,0.55);
      animation: inviteBreathe 2.6s ease-in-out infinite;
    }
    @keyframes inviteBreathe {
      0%,100% { opacity: 1;    text-shadow: 0 0 18px rgba(255,255,255,0.55); }
      50%     { opacity: 0.42; text-shadow: 0 0 6px  rgba(255,255,255,0.18); }
    }
    .invite-sub {
      font-size: 8px;
      font-weight: 700;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.36);
    }
    body.is-live .invite {
      /* kill inviteIn — its `both` fill-mode would out-rank these declarations */
      animation: none;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, calc(-50% - 18px));
    }

    /* ══════════════════════════════════════
       LIVE — status + threshold
    ══════════════════════════════════════ */
    .hud {
      position: fixed;
      top: 80%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 22px;
      width: 300px;
      max-width: 84vw;
      opacity: 0;
      pointer-events: none;
      transition: opacity 1.1s ease;
    }
    body.is-live .hud { opacity: 1; pointer-events: auto; }

    .status-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 10px rgba(255,255,255,0.9), 0 0 22px rgba(255,255,255,0.45);
      flex-shrink: 0;
      /* live scale is driven by the audio in JS */
      transform: scale(1);
    }
    .status-text {
      font-size: 9px;
      font-weight: 900;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.55);
      white-space: nowrap;
    }

    /* ── Threshold button — holds back until you've experienced it ── */
    #enter-btn {
      width: 100%;
      padding: 15px 24px;
      border: 2px solid rgba(255,255,255,0.32);
      border-radius: 50px;
      background: transparent;
      color: var(--white);
      font-family: 'Nunito', sans-serif;
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 7px;
      text-transform: uppercase;
      cursor: pointer;
      outline: none;
      overflow: hidden;
      position: relative;
      -webkit-tap-highlight-color: transparent;
      opacity: 0;
      transform: translateY(10px) scale(0.97);
      pointer-events: none;
      transition:
        opacity      0.9s ease,
        transform    0.9s cubic-bezier(0.16,1,0.3,1),
        border-color 0.3s ease,
        background   0.3s ease,
        box-shadow   0.3s ease,
        color        0.3s ease;
    }
    body.can-enter #enter-btn {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }
    #enter-btn::before {
      content: '';
      position: absolute;
      top: 0; bottom: 0;
      left: -120%; width: 60%;
      background: linear-gradient(90deg, transparent, rgba(57,255,110,0.12), transparent);
      transition: left 0.5s ease;
      pointer-events: none;
    }
    #enter-btn:hover {
      transform: scale(1.05);
      border-color: var(--green);
      background: rgba(57,255,110,0.1);
      color: var(--green);
      box-shadow:
        0 0 20px var(--green-glow),
        0 0 50px rgba(57,255,110,0.18),
        0 0 90px rgba(57,255,110,0.07);
      text-shadow: 0 0 12px rgba(57,255,110,0.7);
    }
    #enter-btn:hover::before { left: 160%; }
    #enter-btn:active { transform: scale(0.97); transition-duration: 0.08s; }

    /* ── Threshold crossing ── */
    .flash {
      position: fixed;
      inset: 0;
      z-index: 60;
      background: #000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.85s ease-in;
    }
    body.is-exiting .flash    { opacity: 1; }
    body.is-exiting .hud,
    body.is-exiting .help-btn { opacity: 0; transition: opacity 0.4s ease; }

    /* ── Help button ── */
    .help-btn {
      position: fixed;
      bottom: 22px; right: 22px;
      z-index: 20;
      width: 34px; height: 34px;
      border-radius: 50%;
      background: transparent;
      border: 1px solid rgba(255,255,255,0.22);
      color: rgba(255,255,255,0.35);
      font-family: 'Nunito', sans-serif;
      font-size: 15px;
      font-weight: 900;
      cursor: pointer;
      transition: border-color 0.3s, color 0.3s, box-shadow 0.3s;
      -webkit-tap-highlight-color: transparent;
    }
    .help-btn:hover {
      border-color: rgba(255,255,255,0.55);
      color: rgba(255,255,255,0.8);
      box-shadow: 0 0 12px rgba(255,255,255,0.08);
    }

    /* ── Help form overlay ── */
    .help-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.88);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s;
      padding: 20px;
    }
    .help-overlay.active { opacity: 1; pointer-events: all; }

    @keyframes panelFadeUp {
      from { opacity: 0; transform: translateY(20px) scale(0.96); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .help-panel {
      position: relative;
      width: 380px;
      max-width: 100%;
      padding: 44px 36px;
      background: rgba(4,4,4,0.97);
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 3px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      animation: panelFadeUp 0.5s cubic-bezier(0.16,1,0.3,1) both;
    }

    /* corner brackets */
    .hframe {
      position: absolute;
      width: 28px; height: 28px;
    }
    .hframe.tl { top:-1px; left:-1px;   border-top:  1.5px solid rgba(57,255,110,0.65); border-left: 1.5px solid rgba(57,255,110,0.65); box-shadow: -3px -3px 12px rgba(57,255,110,0.25); }
    .hframe.tr { top:-1px; right:-1px;  border-top:  1.5px solid rgba(57,255,110,0.65); border-right:1.5px solid rgba(57,255,110,0.65); box-shadow:  3px -3px 12px rgba(57,255,110,0.25); }
    .hframe.bl { bottom:-1px; left:-1px;  border-bottom:1.5px solid rgba(57,255,110,0.65); border-left: 1.5px solid rgba(57,255,110,0.65); box-shadow: -3px  3px 12px rgba(57,255,110,0.25); }
    .hframe.br { bottom:-1px; right:-1px; border-bottom:1.5px solid rgba(57,255,110,0.65); border-right:1.5px solid rgba(57,255,110,0.65); box-shadow:  3px  3px 12px rgba(57,255,110,0.25); }

    /* AWAITING INPUT status row */
    .hf-status-row {
      display: flex;
      align-items: center;
      gap: 10px;
      align-self: flex-start;
      margin-bottom: 2px;
    }
    .hf-status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #39ff6e;
      box-shadow: 0 0 8px rgba(57,255,110,0.7), 0 0 18px rgba(57,255,110,0.3);
      flex-shrink: 0;
      animation: greenBlink 1.4s ease-in-out infinite;
    }
    @keyframes greenBlink {
      0%, 100% { opacity: 1;    box-shadow: 0 0 8px rgba(57,255,110,0.7), 0 0 18px rgba(57,255,110,0.3); }
      50%      { opacity: 0.08; box-shadow: none; }
    }
    .hf-status-text {
      font-family: 'Nunito', sans-serif;
      font-size: 9px;
      font-weight: 900;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.35);
    }

    .help-label {
      font-size: 9px;
      font-weight: 900;
      letter-spacing: 6px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.4);
      align-self: flex-start;
    }
    .help-tagline {
      font-size: 8px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.2);
      text-align: center;
      line-height: 1.7;
    }

    /* inputs */
    .hf-wrap { width: 100%; transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1); }
    .hf-wrap:hover, .hf-wrap:focus-within { transform: scale(1.03); }

    .hf-input {
      width: 100%;
      padding: 14px 22px;
      background: transparent;
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 50px;
      color: #f0f4ff;
      font-family: 'Nunito', sans-serif;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 1px;
      outline: none;
      transition: border-color 0.3s, box-shadow 0.3s;
      -webkit-appearance: none;
    }
    .hf-input:focus {
      border-color: rgba(57,255,110,0.65);
      box-shadow: 0 0 0 3px rgba(57,255,110,0.06);
    }
    .hf-input::placeholder {
      color: rgba(255,255,255,0.2);
      font-size: 11px;
      letter-spacing: 2px;
    }

    .hf-submit {
      width: 100%;
      padding: 15px 24px;
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 50px;
      background: transparent;
      color: #f0f4ff;
      font-family: 'Nunito', sans-serif;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 6px;
      text-transform: uppercase;
      cursor: pointer;
      transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1), border-color 0.3s, color 0.3s, box-shadow 0.3s;
      -webkit-tap-highlight-color: transparent;
    }
    .hf-submit:hover {
      transform: scale(1.04);
      border-color: rgba(57,255,110,0.7);
      color: #39ff6e;
      box-shadow: 0 0 20px rgba(57,255,110,0.25);
    }
    .hf-submit:active { transform: scale(0.97); }

    .hf-close {
      font-size: 8px;
      font-weight: 700;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.18);
      cursor: pointer;
      border: none;
      background: transparent;
      font-family: 'Nunito', sans-serif;
      transition: color 0.25s;
      animation: dismissBlink 1.3s ease-in-out infinite;
    }
    @keyframes dismissBlink { 0%,100%{opacity:1} 50%{opacity:0.35} }
    .hf-close:hover { color: rgba(255,255,255,0.5); animation: none; }

    /* Prevent iOS auto-zoom on input focus */
    @media (max-width: 768px) {
      .hf-input { font-size: 16px !important; }
    }

    /* success state */
    .hf-success {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding: 12px 0;
      text-align: center;
      width: 100%;
    }
    .hf-success-icon {
      font-size: 24px;
      color: #39ff6e;
      text-shadow: 0 0 16px rgba(57,255,110,0.8);
    }
    .hf-success-title {
      font-family: 'Nunito', sans-serif;
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: #f0f4ff;
      text-shadow: 0 0 16px rgba(255,255,255,0.5);
    }
    .hf-success-sub {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.28);
    }
  </style>
</head>
<body class="is-dormant">

  <video autoplay muted loop playsinline id="bg-video">
    <source src="assets/bg.mp4" type="video/mp4" />
  </video>

  <div class="overlay"></div>

  <audio id="bg-music" loop>
    <source src="assets/music.mp3" type="audio/mpeg">
  </audio>

  <!-- THE BLOOM — never-ending generative loader -->
  <canvas id="viz"></canvas>

  <!-- DORMANT: the invitation -->
  <div class="invite" id="invite">
    <span class="invite-text">Touch to Begin</span>
    <span class="invite-sub">Sound On · Headphones Recommended</span>
  </div>

  <!-- LIVE: status + threshold -->
  <div class="hud" id="hud">
    <div class="status-row">
      <div class="status-dot" id="status-dot"></div>
      <span class="status-text" id="status-text">Signal Acquired</span>
    </div>
    <button id="enter-btn">Enter</button>
  </div>

  <div class="flash"></div>

  <!-- HELP BUTTON -->
  <button class="help-btn" id="help-btn" aria-label="Early access">?</button>

  <!-- HELP / EARLY ACCESS FORM OVERLAY -->
  <!-- Netlify form detected at deploy time via data-netlify attribute -->
  <div class="help-overlay" id="help-overlay">
    <div class="help-panel">
      <span class="hframe tl"></span>
      <span class="hframe tr"></span>
      <span class="hframe bl"></span>
      <span class="hframe br"></span>

      <div class="hf-status-row">
        <span class="hf-status-dot"></span>
        <span class="hf-status-text">Awaiting Input</span>
      </div>
      <span class="help-label">Access List</span>
      <p class="help-tagline">Early Access Codes · Exclusive Products · And More</p>

      <!-- Success state -->
      <div class="hf-success" id="hf-success">
        <div class="hf-success-icon">✦</div>
        <div class="hf-success-title">You're on the List</div>
        <div class="hf-success-sub">Watch your inbox.</div>
      </div>

      <!-- Netlify form -->
      <form id="help-form" name="early-access" data-netlify="true"
            style="width:100%;display:flex;flex-direction:column;gap:14px;">
        <input type="hidden" name="form-name" value="early-access">

        <div class="hf-wrap">
          <input class="hf-input" type="text" name="name"
                 placeholder="Your Name" required>
        </div>
        <div class="hf-wrap">
          <input class="hf-input" type="email" name="email"
                 placeholder="Your Email Address" required>
        </div>

        <button class="hf-submit" type="submit">Request Access</button>
      </form>

      <button class="hf-close" id="hf-close">[ Close ]</button>
    </div>
  </div>

  <script>
  /* ════════════════════════════════════════
     THE BLOOM
     A generative loader that never repeats.
     One contour, one sweep, one core — the
     contour is a live FFT of the music. It
     rests almost bare, then breaks into a
     movement every ten seconds or so, and
     the irrational speeds mean it has no
     loop point to arrive back at.
  ════════════════════════════════════════ */
  const TAU   = Math.PI * 2;
  const body  = document.body;
  const music = document.getElementById('bg-music');
  const cvs   = document.getElementById('viz');
  const ctx   = cvs.getContext('2d');
  const dotEl = document.getElementById('status-dot');
  const stEl  = document.getElementById('status-text');
  const enterBtn = document.getElementById('enter-btn');
  const helpOverlay = document.getElementById('help-overlay');

  const REDUCE = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  let state = 'dormant';   /* dormant → live → exiting */

  /* ── Value noise (deterministic, smooth, non-repeating in practice) ── */
  function hash(n) { const s = Math.sin(n) * 43758.5453123; return s - Math.floor(s); }
  function noise(x) {
    const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f);
    return hash(i) * (1 - u) + hash(i + 1) * u;
  }

  /* ── Canvas sizing ── */
  let W = 0, H = 0, cx = 0, cy = 0, R = 0;
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cvs.width  = Math.round(W * dpr);
    cvs.height = Math.round(H * dpr);
    cvs.style.width  = W + 'px';
    cvs.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cx = W / 2;
    cy = H * 0.43;
    /* Clamped so the bloom never grows into the HUD on short or narrow viewports */
    R  = Math.min(Math.max(Math.min(W, H) * 0.115, 62), H * 0.155);
  }
  resize();
  window.addEventListener('resize', resize);

  /* ── Audio graph (built inside the activating gesture) ── */
  let audioCtx = null, analyser = null, freq = null, gain = null;
  function initAudio() {
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) { music.volume = 0.5; return; }
      audioCtx = new AC();
      const src = audioCtx.createMediaElementSource(music);
      analyser  = audioCtx.createAnalyser();
      analyser.fftSize = 512;
      analyser.smoothingTimeConstant = 0.8;
      gain = audioCtx.createGain();
      gain.gain.value = 0.0001;
      src.connect(analyser);
      analyser.connect(gain);
      gain.connect(audioCtx.destination);
      freq = new Uint8Array(analyser.frequencyBinCount);
      audioCtx.resume();
      /* slow bloom-in of the sound */
      gain.gain.exponentialRampToValueAtTime(0.75, audioCtx.currentTime + 2.6);
    } catch (e) {
      analyser = null;
      music.volume = 0.5;
    }
  }

  /* ── The contour — one closed ring, deformed by the spectrum.
        Mirrored across the vertical axis so it reads as a shape,
        not as a crowd of bars. ── */
  const WPTS = 168;
  const wave = new Float32Array(WPTS);

  /* ── Ripples — capped, so a busy passage can't stack them up ── */
  const ripples = [];
  const MAX_RIPPLES = 3;
  function ripple(r, a) {
    if (ripples.length >= MAX_RIPPLES) ripples.shift();
    ripples.push({ r: r, a: a });
  }

  /* ── Frame state ── */
  let last = performance.now();
  let T = 0;                 /* elapsed seconds                  */
  let bass = 0, mid = 0, treb = 0, energy = 0;
  let bassAvg = 0, lastBeat = 0;
  let sweep = 0, rot = 0;
  let collapse = 1;          /* 1 → 0 during the exit implosion  */
  let climax  = 0;           /* short white bloom after a movement */

  /* ════════════════════════════════════════
     MOVEMENTS
     The loader rests, then does one thing —
     never two at once, never the same twice
     in a row. All the drama lives here, so
     the resting state can stay bare.
  ════════════════════════════════════════ */
  const ACTS = ['surge', 'inhale', 'spokes', 'eclipse'];
  let act = null;            /* { name, dur } while a movement runs */
  let actP = 0;              /* linear   0 → 1  */
  let actEnv = 0;            /* smooth   0 → 1 → 0 */
  let nextActAt = 7;
  let lastActName = '';

  function pickAct() {
    let n;
    do { n = ACTS[(Math.random() * ACTS.length) | 0]; } while (n === lastActName);
    lastActName = n;
    return n;
  }

  function updateActs(dt) {
    climax = Math.max(0, climax - dt * 1.7);
    if (state === 'exiting') { act = null; actEnv = 0; return; }

    if (!act) {
      actEnv = 0; actP = 0;
      if (T >= nextActAt) {
        act = { name: pickAct(), t0: T, dur: 3.2 + Math.random() * 1.9 };
        if (act.name === 'surge') ripple(R * 0.85, 0.45);
      }
      return;
    }

    actP = (T - act.t0) / act.dur;
    if (actP >= 1) {
      /* the movements that hold something back release it here */
      if (act.name === 'inhale' || act.name === 'eclipse') {
        ripple(R * 0.5, 0.75);
        climax = 1;
      }
      act = null; actP = 0; actEnv = 0;
      nextActAt = T + 9 + Math.random() * 9;
      return;
    }
    actEnv = Math.sin(Math.PI * actP) * (REDUCE ? 0.3 : 1);
  }

  function readAudio() {
    if (analyser) {
      analyser.getByteFrequencyData(freq);
      const n = freq.length;
      const bEnd = Math.floor(n * 0.08), mEnd = Math.floor(n * 0.38);
      let b = 0, m = 0, h = 0;
      for (let i = 0;    i < bEnd; i++) b += freq[i];
      for (let i = bEnd; i < mEnd; i++) m += freq[i];
      for (let i = mEnd; i < n;    i++) h += freq[i];
      bass = b / (bEnd * 255);
      mid  = m / ((mEnd - bEnd) * 255);
      treb = h / ((n - mEnd) * 255);
    } else {
      /* Dormant (or no Web Audio): breathe on noise so it still evolves */
      bass = 0.15 + 0.09 * Math.sin(T * 0.9);
      mid  = 0.11 + 0.07 * noise(T * 0.35);
      treb = 0.06 + 0.05 * noise(T * 0.6 + 11);
    }
    energy = bass * 0.6 + mid * 0.3 + treb * 0.1;
  }

  /* Spectrum → contour. Smoothed hard in time so the ring breathes
     with the music instead of flickering with every frame. */
  function readWave() {
    const half = WPTS / 2;
    for (let i = 0; i < WPTS; i++) {
      const m = Math.abs(i - half) / half;    /* 0 at the seam … 1 opposite */
      let target;
      if (analyser) {
        const raw = freq[Math.floor(m * (freq.length - 1) * 0.62)] / 255;
        /* the top of the spectrum is always quieter — tilt it back up */
        target = Math.min(1, Math.pow(raw, 0.8) * (0.8 + 1.4 * m));
      } else {
        /* dormant: breathe on noise so the shape still lives */
        target = 0.14 + 0.26 * noise(m * 4.5 + T * 0.5);
      }
      wave[i] += (target - wave[i]) * 0.2;
    }
  }

  function detectBeat(now) {
    bassAvg += (bass - bassAvg) * 0.06;
    /* a higher bar than before — ripples are now an event, not a texture */
    if (bass > bassAvg * 1.45 && bass > 0.22 && now - lastBeat > 520) {
      lastBeat = now;
      ripple(R * 0.95, 0.4);
    }
  }

  function frame(now) {
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    T += dt;

    readAudio();
    readWave();
    updateActs(dt);
    if (state === 'live') detectBeat(now);
    if (state === 'exiting') collapse = Math.max(0, collapse - dt * 1.5);

    /* ── What the current movement does to the resting state ── */
    let ampMul = 1, ringScale = 1, ringAlpha = 1, coreMul = 1, glow = 1, spokes = 0, spin = 0;
    if (act) {
      const e = actEnv;
      if (act.name === 'surge') {
        /* the contour swells and burns brighter */
        ampMul = 1 + e * 1.7; glow = 1 + e * 1.8; coreMul = 1 + e * 0.45;
      } else if (act.name === 'inhale') {
        /* drawn in tight, then sprung back out */
        const inP  = Math.min(1, actP / 0.62);
        const outP = Math.max(0, (actP - 0.62) / 0.38);
        const inE  = inP  * inP  * (3 - 2 * inP);
        const outE = outP * outP * (3 - 2 * outP);
        ringScale = 1 - 0.44 * inE * (1 - outE) + 0.13 * Math.sin(Math.PI * outP);
        ampMul  = 1 - e * 0.5;
        coreMul = 1 + e * 0.9;
      } else if (act.name === 'spokes') {
        /* the only moment the spectrum is allowed to fan out */
        spokes = e;
      } else if (act.name === 'eclipse') {
        /* everything drains and spins up — the release lands after */
        ringAlpha = 1 - e * 0.78;
        coreMul   = 1 - e * 0.85;
        glow      = 1 - e * 0.6;
        spin      = e * 1.5;
      }
    }

    /* Irrational speeds → nothing ever realigns */
    rot   += dt * (0.06 + energy * 0.18 + spin);
    sweep += dt * (0.16 + energy * 0.7) * Math.SQRT2;

    const Rc = R * collapse;
    ctx.clearRect(0, 0, W, H);

    /* Soft shadow anchor so the white still reads once the video brightens */
    const anchor = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(0.001, Rc * 2.1));
    anchor.addColorStop(0,   'rgba(0,0,0,' + (0.5 * collapse).toFixed(3) + ')');
    anchor.addColorStop(0.6, 'rgba(0,0,0,' + (0.26 * collapse).toFixed(3) + ')');
    anchor.addColorStop(1,   'rgba(0,0,0,0)');
    ctx.fillStyle = anchor;
    ctx.fillRect(0, 0, W, H);

    ctx.globalCompositeOperation = 'lighter';
    ctx.lineCap = 'round';

    /* ── Ripples ── */
    for (let i = ripples.length - 1; i >= 0; i--) {
      const p = ripples[i];
      p.r += dt * (140 + energy * 200);
      p.a -= dt * 0.55;
      if (p.a <= 0) { ripples.splice(i, 1); continue; }
      ctx.beginPath();
      ctx.arc(cx, cy, p.r * collapse, 0, TAU);
      ctx.strokeStyle = 'rgba(255,255,255,' + p.a.toFixed(3) + ')';
      ctx.lineWidth = 1;
      ctx.shadowBlur = 16;
      ctx.shadowColor = 'rgba(255,255,255,0.7)';
      ctx.stroke();
    }

    /* ── The waveform contour — one line, the whole spectrum ── */
    const ringR = Math.max(0.001, Rc * ringScale);
    const amp   = 0.4 * ampMul;
    ctx.shadowColor = 'rgba(255,255,255,0.8)';
    ctx.shadowBlur  = 14 * glow;
    ctx.strokeStyle = 'rgba(255,255,255,' +
      ((0.5 + energy * 0.38 + climax * 0.4) * ringAlpha * collapse).toFixed(3) + ')';
    ctx.lineWidth = 1.3 + energy * 1.1 + climax * 0.8;
    ctx.beginPath();
    for (let i = 0; i <= WPTS; i++) {
      const k   = i % WPTS;
      const ang = (k / WPTS) * TAU - Math.PI / 2 + rot;
      const rr  = ringR * (1 + amp * wave[k]);
      const x = cx + Math.cos(ang) * rr, y = cy + Math.sin(ang) * rr;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.stroke();

    /* ── Fan-out — only ever during a 'spokes' movement ── */
    if (spokes > 0.01) {
      const N = 30;
      ctx.shadowBlur = 10 * glow;
      for (let i = 0; i < N; i++) {
        const m = i / (N - 1);
        const f = analyser
          ? Math.min(1, Math.pow(freq[Math.floor(m * (freq.length - 1) * 0.62)] / 255, 0.8) * (0.8 + 1.4 * m))
          : 0.14 + 0.3 * noise(m * 4.5 + T * 0.5);
        const len = Rc * (0.16 + f * 1.05) * spokes;
        ctx.strokeStyle = 'rgba(255,255,255,' + ((0.16 + f * 0.5) * spokes * collapse).toFixed(3) + ')';
        ctx.lineWidth = 1.1 + f * 1.3;
        /* the contour carries this same band at this same angle — start each
           spoke just off the crest, so the fan reads as the ring throwing
           the spectrum off itself */
        const k  = Math.floor((WPTS / 2) * (1 - m));
        const r0 = ringR * (1.05 + amp * wave[k]);
        for (let s = -1; s <= 1; s += 2) {
          const ang = s * (1 - m) * Math.PI - Math.PI / 2 + rot;
          const ca = Math.cos(ang), sa = Math.sin(ang);
          ctx.beginPath();
          ctx.moveTo(cx + ca * r0, cy + sa * r0);
          ctx.lineTo(cx + ca * (r0 + len), cy + sa * (r0 + len));
          ctx.stroke();
        }
      }
    }

    /* ── The one sweep — a single arc, and the point that leads it.
          Its gap never closes, so the loader never resolves. ── */
    const sweepR = Rc * 1.62;
    const arcLen = (0.12 + noise(T * 0.11) * 0.34) * TAU;
    const sweepA = sweep * TAU;
    ctx.shadowBlur = 22 * glow;
    ctx.beginPath();
    ctx.arc(cx, cy, sweepR, sweepA, sweepA + arcLen);
    ctx.strokeStyle = 'rgba(255,255,255,' +
      ((0.34 + energy * 0.3) * ringAlpha * collapse).toFixed(3) + ')';
    ctx.lineWidth = 1.6;
    ctx.stroke();

    const lx = cx + Math.cos(sweepA + arcLen) * sweepR;
    const ly = cy + Math.sin(sweepA + arcLen) * sweepR;
    ctx.beginPath();
    ctx.arc(lx, ly, 1.6 + bass * 1.7, 0, TAU);
    ctx.fillStyle = 'rgba(255,255,255,' + ((0.6 + treb * 0.4) * ringAlpha * collapse).toFixed(3) + ')';
    ctx.shadowBlur = 14;
    ctx.fill();

    /* ── Core orb ── */
    const orbR = Math.max(0.001, Rc * (0.46 + bass * 0.5) * ringScale);
    const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, orbR);
    const boost = (state === 'exiting' ? (1 - collapse) * 0.9 : 0) + climax * 0.45;
    const core  = Math.max(0, coreMul);
    g.addColorStop(0,    'rgba(255,255,255,' + Math.min(1, (0.4 + bass * 0.42) * core + boost).toFixed(3) + ')');
    g.addColorStop(0.35, 'rgba(255,255,255,' + (0.12 * core + boost * 0.4).toFixed(3) + ')');
    g.addColorStop(1,    'rgba(255,255,255,0)');
    ctx.shadowBlur = 0;
    ctx.beginPath();
    ctx.arc(cx, cy, orbR, 0, TAU);
    ctx.fillStyle = g;
    ctx.fill();

    ctx.globalCompositeOperation = 'source-over';
    ctx.shadowBlur = 0;

    /* Status dot rides the bass */
    if (state === 'live') {
      dotEl.style.transform = 'scale(' + (1 + bass * 0.9).toFixed(3) + ')';
    }

    rafId = requestAnimationFrame(frame);
  }

  let rafId = requestAnimationFrame(frame);

  /* Don't burn cycles in a hidden tab */
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      cancelAnimationFrame(rafId);
    } else {
      last = performance.now();
      rafId = requestAnimationFrame(frame);
    }
  });

  /* ════════════════════════════════════════
     ACTIVATION — first gesture wakes it
  ════════════════════════════════════════ */
  const SEQUENCE = [
    [0,    'Signal Acquired'],
    [1600, 'Rendering Environment'],
    [3200, 'System Live']
  ];

  function activate() {
    if (state !== 'dormant') return;
    state = 'live';
    body.classList.remove('is-dormant');
    body.classList.add('is-live');

    initAudio();
    music.play().catch(() => {});

    SEQUENCE.forEach(([ms, text]) => setTimeout(() => {
      if (state === 'live') stEl.textContent = text;
    }, ms));

    /* Hold the threshold back so the installation is actually experienced */
    setTimeout(() => body.classList.add('can-enter'), REDUCE ? 600 : 3400);
  }

  ['pointerdown', 'touchstart', 'keydown'].forEach(evt =>
    document.addEventListener(evt, activate, { passive: true })
  );

  /* ════════════════════════════════════════
     THRESHOLD
  ════════════════════════════════════════ */
  function enterSite() {
    if (state !== 'live' || !body.classList.contains('can-enter')) return;
    state = 'exiting';
    body.classList.add('is-exiting');

    /* Hand the music across to /home so it doesn't restart */
    try { sessionStorage.setItem('stars_audio_t', String(music.currentTime)); } catch (e) {}

    /* One last bloom on the way out */
    ripple(R * 0.5, 0.75);
    climax = 1;
    if (gain && audioCtx) {
      try { gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.85); } catch (e) {}
    }
    setTimeout(() => { window.location.href = '/home'; }, 900);
  }

  enterBtn.addEventListener('click', enterSite);

  document.addEventListener('keydown', e => {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    /* Never steal the key from the access-list form */
    if (helpOverlay.classList.contains('active')) return;
    if (['INPUT', 'TEXTAREA', 'SELECT'].includes(e.target.tagName)) return;
    if (body.classList.contains('can-enter')) { e.preventDefault(); enterSite(); }
  });

  /* ════════════════════════════════════════
     HELP / EARLY ACCESS
  ════════════════════════════════════════ */
  function openHelp()  { helpOverlay.classList.add('active'); }
  function closeHelp() {
    helpOverlay.classList.remove('active');
    /* Release focus — otherwise it stays trapped in the hidden form and the
       next Enter fires that form's validation instead of the threshold. */
    if (document.activeElement && helpOverlay.contains(document.activeElement)) {
      document.activeElement.blur();
    }
    setTimeout(() => {
      const f = document.getElementById('help-form');
      const s = document.getElementById('hf-success');
      if (f) { f.reset(); f.style.display = ''; }
      if (s) s.style.display = '';
    }, 400);
  }

  document.getElementById('help-btn').addEventListener('click', openHelp);
  document.getElementById('hf-close').addEventListener('click', closeHelp);
  helpOverlay.addEventListener('click', e => {
    if (!e.target.closest('.help-panel')) closeHelp();
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeHelp();
  });

  document.getElementById('help-form').addEventListener('submit', async e => {
    e.preventDefault();
    try {
      await fetch('/', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: new URLSearchParams(new FormData(e.target)).toString()
      });
    } catch (err) { /* proceeds to success state on live Netlify site */ }
    e.target.style.display = 'none';
    document.getElementById('hf-success').style.display = 'flex';
    setTimeout(closeHelp, 3200);
  });
  </script>
</body>
</html>
