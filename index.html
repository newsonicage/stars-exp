<!DOCTYPE html>
<html lang="en">
<head>

  <!-- ══════════════════════════════════════════
       THE THRESHOLD, ONCE.
       The boot sequence is the site's front door and it
       should stay that way — but only the first time.
       Someone who already crossed it this week and came
       back is not a new arrival, and making them watch
       it again is a toll, not a ritual.

       Inline and above everything else on purpose: it has
       to decide before the first paint, or the splash
       flashes up and yanks itself away.
  ══════════════════════════════════════════ -->
  <script>
    (function () {
      var DAYS = 7;
      try {
        /* An explicit ?enter=1 always shows the splash — that is the link
           to send when you want someone to get the full thing. */
        if (location.search.indexOf('enter=1') > -1) { localStorage.removeItem('stars_crossed'); return; }
        var last = parseInt(localStorage.getItem('stars_crossed') || '0', 10);
        if (last && (Date.now() - last) < DAYS * 864e5) {
          location.replace('/home');
        }
      } catch (e) { /* private mode — everyone gets the front door */ }
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --green:      #39ff6e;
      --green-glow: rgba(57,255,110,0.5);
      --white:      #f0f4ff;
      /* same stack the archive sets — the scrambling reads as one hand */
      --mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      background: #000;
      font-family: 'Nunito', sans-serif;
    }

    /* ── BG Video — B&W, wakes when the installation goes live ── */
    #bg-video {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
      opacity: 0.34;
      filter: grayscale(1) brightness(0.62);
      transition: opacity 2.4s ease, filter 2.4s ease;
    }
    body.is-live #bg-video {
      opacity: 0.8;
      filter: grayscale(1) brightness(1) contrast(1.06);
    }

    /* ── Vignette — opens up once live ── */
    .overlay {
      position: fixed;
      inset: 0;
      z-index: 1;
      background: radial-gradient(ellipse at center,
        rgba(0,0,0,0.15) 0%,
        rgba(0,0,0,0.72) 100%
      );
      pointer-events: none;
      transition: background 2.4s ease;
    }
    body.is-live .overlay {
      background: radial-gradient(ellipse at center,
        rgba(0,0,0,0.08) 0%,
        rgba(0,0,0,0.58) 100%
      );
    }

    /* ══════════════════════════════════════
       THE TERMINAL — one column, centred.
       Everything the splash says, it says in
       glyphs that resolve out of noise.
    ══════════════════════════════════════ */
    .term {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
      width: 460px;
      max-width: 88vw;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      font-family: var(--mono);
      font-variant-ligatures: none;
      animation: termIn 1.2s cubic-bezier(0.16,1,0.3,1) both;
    }
    @keyframes termIn {
      from { opacity: 0; transform: translate(-50%, calc(-50% + 12px)); }
      to   { opacity: 1; transform: translate(-50%, -50%); }
    }

    /* ── Wordmark — scrambles until you touch it, then locks ── */
    .term-mark {
      font-family: 'Nunito', sans-serif;
      font-size: 30px;
      font-weight: 900;
      letter-spacing: 16px;
      text-transform: uppercase;
      text-align: center;
      color: var(--white);
      text-shadow: 0 0 26px rgba(255,255,255,0.35);
      white-space: nowrap;
      /* the glyphs are wider than the mark — hold the box steady */
      min-height: 42px;
      margin-bottom: 22px;
    }
    .term-mark.is-noise { color: rgba(255,255,255,0.5); font-size: 22px; letter-spacing: 10px; }

    .term-rule {
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.22) 18%, rgba(255,255,255,0.22) 82%, transparent);
    }

    /* ── The log — one row per system, dot-leaders between.
          Sealed shut until the first gesture, then it opens. ── */
    .term-log {
      display: flex;
      flex-direction: column;
      gap: 9px;
      padding: 0 2px;
      max-height: 0;
      overflow: hidden;
      transition: max-height 1.1s cubic-bezier(0.16,1,0.3,1), padding 1.1s cubic-bezier(0.16,1,0.3,1);
    }
    body.is-live .term-log { max-height: 200px; padding: 18px 2px; }
    .row {
      display: flex;
      align-items: baseline;
      gap: 8px;
      font-size: 9.5px;
      letter-spacing: 2.2px;
      text-transform: uppercase;
      opacity: 0;
      transition: opacity 0.5s ease;
    }
    .row.in { opacity: 1; }
    .row-k { color: rgba(255,255,255,0.42); white-space: nowrap; }
    .row-dots {
      flex: 1;
      overflow: hidden;
      white-space: nowrap;
      color: rgba(255,255,255,0.12);
      letter-spacing: 3px;
      transform: translateY(-2px);
    }
    .row-v {
      color: var(--green);
      text-shadow: 0 0 12px rgba(57,255,110,0.45);
      white-space: nowrap;
      min-width: 62px;
      text-align: right;
    }
    .row-v.is-pending { color: rgba(255,255,255,0.45); text-shadow: none; }
    /* the signal row carries the music instead of a word */
    .row-v.is-meter {
      color: rgba(255,255,255,0.9);
      text-shadow: 0 0 14px rgba(255,255,255,0.4);
      letter-spacing: 1px;
      min-width: 120px;
      font-size: 11px;
    }

    .term-foot {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding-top: 14px;
      font-size: 8px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.3);
      min-height: 20px;
    }
    .term-foot .caret { color: var(--green); animation: caretBlink 1.15s steps(1) infinite; }
    @keyframes caretBlink { 0%,55% { opacity: 1; } 56%,100% { opacity: 0; } }
    .node-id { color: rgba(255,255,255,0.45); letter-spacing: 1.6px; }
    /* the caret takes the beat */
    #foot-l { transition: color 0.18s ease; }
    #foot-l.hit { color: rgba(255,255,255,0.72); }
    #foot-l.hit .caret { color: #fff; text-shadow: 0 0 14px rgba(255,255,255,0.9); animation: none; opacity: 1; }

    /* ── DORMANT: the invitation, sat where ENTER will land ── */
    .invite {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      text-align: center;
      cursor: pointer;
      padding-top: 20px;
      transition: opacity 0.7s ease, transform 0.7s cubic-bezier(0.16,1,0.3,1);
    }
    .invite-text {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 7px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.82);
      text-shadow: 0 0 18px rgba(255,255,255,0.5);
      animation: inviteBreathe 2.6s ease-in-out infinite;
    }
    @keyframes inviteBreathe {
      0%,100% { opacity: 1;    text-shadow: 0 0 18px rgba(255,255,255,0.5); }
      50%     { opacity: 0.42; text-shadow: 0 0 6px  rgba(255,255,255,0.18); }
    }
    .invite-sub {
      font-size: 8px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.32);
    }
    body.is-live .invite {
      animation: none;
      opacity: 0;
      pointer-events: none;
      height: 0;
      padding: 0;
      overflow: hidden;
      transform: translateY(-10px);
    }

    /* ── LIVE: the threshold ── */
    .hud {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 1.1s ease;
    }
    body.is-live .hud { opacity: 1; pointer-events: auto; }

    /* ── Threshold button — holds back until the boot has run ── */
    #enter-btn {
      width: 100%;
      padding: 15px 24px;
      border: 2px solid rgba(255,255,255,0.32);
      border-radius: 50px;
      background: transparent;
      color: var(--white);
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 7px;
      text-transform: uppercase;
      cursor: pointer;
      outline: none;
      overflow: hidden;
      position: relative;
      -webkit-tap-highlight-color: transparent;
      opacity: 0;
      transform: translateY(10px) scale(0.97);
      pointer-events: none;
      transition:
        opacity      0.9s ease,
        transform    0.9s cubic-bezier(0.16,1,0.3,1),
        border-color 0.3s ease,
        background   0.3s ease,
        box-shadow   0.3s ease,
        color        0.3s ease;
    }
    body.can-enter #enter-btn {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }
    #enter-btn::before {
      content: '';
      position: absolute;
      top: 0; bottom: 0;
      left: -120%; width: 60%;
      background: linear-gradient(90deg, transparent, rgba(57,255,110,0.12), transparent);
      transition: left 0.5s ease;
      pointer-events: none;
    }
    #enter-btn:hover {
      transform: scale(1.05);
      border-color: var(--green);
      background: rgba(57,255,110,0.1);
      color: var(--green);
      box-shadow:
        0 0 20px var(--green-glow),
        0 0 50px rgba(57,255,110,0.18),
        0 0 90px rgba(57,255,110,0.07);
      text-shadow: 0 0 12px rgba(57,255,110,0.7);
    }
    #enter-btn:hover::before { left: 160%; }
    #enter-btn:active { transform: scale(0.97); transition-duration: 0.08s; }

    /* ── Threshold crossing ── */
    .flash {
      position: fixed;
      inset: 0;
      z-index: 60;
      background: #000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.85s ease-in;
    }
    body.is-exiting .flash    { opacity: 1; }
    body.is-exiting .hud,
    body.is-exiting .help-btn { opacity: 0; transition: opacity 0.4s ease; }

    /* ── Help button ── */
    .help-btn {
      position: fixed;
      bottom: 22px; right: 22px;
      z-index: 20;
      width: 34px; height: 34px;
      border-radius: 50%;
      background: transparent;
      border: 1px solid rgba(255,255,255,0.22);
      color: rgba(255,255,255,0.35);
      font-family: 'Nunito', sans-serif;
      font-size: 15px;
      font-weight: 900;
      cursor: pointer;
      transition: border-color 0.3s, color 0.3s, box-shadow 0.3s;
      -webkit-tap-highlight-color: transparent;
    }
    .help-btn:hover {
      border-color: rgba(255,255,255,0.55);
      color: rgba(255,255,255,0.8);
      box-shadow: 0 0 12px rgba(255,255,255,0.08);
    }

    /* ── Help form overlay ── */
    .help-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.88);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s;
      padding: 20px;
    }
    .help-overlay.active { opacity: 1; pointer-events: all; }

    @keyframes panelFadeUp {
      from { opacity: 0; transform: translateY(20px) scale(0.96); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .help-panel {
      position: relative;
      width: 380px;
      max-width: 100%;
      padding: 44px 36px;
      background: rgba(4,4,4,0.97);
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 3px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      animation: panelFadeUp 0.5s cubic-bezier(0.16,1,0.3,1) both;
    }

    /* corner brackets */
    .hframe {
      position: absolute;
      width: 28px; height: 28px;
    }
    .hframe.tl { top:-1px; left:-1px;   border-top:  1.5px solid rgba(57,255,110,0.65); border-left: 1.5px solid rgba(57,255,110,0.65); box-shadow: -3px -3px 12px rgba(57,255,110,0.25); }
    .hframe.tr { top:-1px; right:-1px;  border-top:  1.5px solid rgba(57,255,110,0.65); border-right:1.5px solid rgba(57,255,110,0.65); box-shadow:  3px -3px 12px rgba(57,255,110,0.25); }
    .hframe.bl { bottom:-1px; left:-1px;  border-bottom:1.5px solid rgba(57,255,110,0.65); border-left: 1.5px solid rgba(57,255,110,0.65); box-shadow: -3px  3px 12px rgba(57,255,110,0.25); }
    .hframe.br { bottom:-1px; right:-1px; border-bottom:1.5px solid rgba(57,255,110,0.65); border-right:1.5px solid rgba(57,255,110,0.65); box-shadow:  3px  3px 12px rgba(57,255,110,0.25); }

    /* AWAITING INPUT status row */
    .hf-status-row {
      display: flex;
      align-items: center;
      gap: 10px;
      align-self: flex-start;
      margin-bottom: 2px;
    }
    .hf-status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #39ff6e;
      box-shadow: 0 0 8px rgba(57,255,110,0.7), 0 0 18px rgba(57,255,110,0.3);
      flex-shrink: 0;
      animation: greenBlink 1.4s ease-in-out infinite;
    }
    @keyframes greenBlink {
      0%, 100% { opacity: 1;    box-shadow: 0 0 8px rgba(57,255,110,0.7), 0 0 18px rgba(57,255,110,0.3); }
      50%      { opacity: 0.08; box-shadow: none; }
    }
    .hf-status-text {
      font-family: 'Nunito', sans-serif;
      font-size: 9px;
      font-weight: 900;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.35);
    }

    .help-label {
      font-size: 9px;
      font-weight: 900;
      letter-spacing: 6px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.4);
      align-self: flex-start;
    }
    .help-tagline {
      font-size: 8px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.2);
      text-align: center;
      line-height: 1.7;
    }

    /* inputs */
    .hf-wrap { width: 100%; transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1); }
    .hf-wrap:hover, .hf-wrap:focus-within { transform: scale(1.03); }

    .hf-input {
      width: 100%;
      padding: 14px 22px;
      background: transparent;
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 50px;
      color: #f0f4ff;
      font-family: 'Nunito', sans-serif;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 1px;
      outline: none;
      transition: border-color 0.3s, box-shadow 0.3s;
      -webkit-appearance: none;
    }
    .hf-input:focus {
      border-color: rgba(57,255,110,0.65);
      box-shadow: 0 0 0 3px rgba(57,255,110,0.06);
    }
    .hf-input::placeholder {
      color: rgba(255,255,255,0.2);
      font-size: 11px;
      letter-spacing: 2px;
    }

    .hf-submit {
      width: 100%;
      padding: 15px 24px;
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 50px;
      background: transparent;
      color: #f0f4ff;
      font-family: 'Nunito', sans-serif;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 6px;
      text-transform: uppercase;
      cursor: pointer;
      transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1), border-color 0.3s, color 0.3s, box-shadow 0.3s;
      -webkit-tap-highlight-color: transparent;
    }
    .hf-submit:hover {
      transform: scale(1.04);
      border-color: rgba(57,255,110,0.7);
      color: #39ff6e;
      box-shadow: 0 0 20px rgba(57,255,110,0.25);
    }
    .hf-submit:active { transform: scale(0.97); }

    .hf-close {
      font-size: 8px;
      font-weight: 700;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.18);
      cursor: pointer;
      border: none;
      background: transparent;
      font-family: 'Nunito', sans-serif;
      transition: color 0.25s;
      animation: dismissBlink 1.3s ease-in-out infinite;
    }
    @keyframes dismissBlink { 0%,100%{opacity:1} 50%{opacity:0.35} }
    .hf-close:hover { color: rgba(255,255,255,0.5); animation: none; }

    /* Prevent iOS auto-zoom on input focus */
    @media (max-width: 768px) {
      .hf-input { font-size: 16px !important; }
    }

    /* success state */
    .hf-success {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding: 12px 0;
      text-align: center;
      width: 100%;
    }
    .hf-success-icon {
      font-size: 24px;
      color: #39ff6e;
      text-shadow: 0 0 16px rgba(57,255,110,0.8);
    }
    .hf-success-title {
      font-family: 'Nunito', sans-serif;
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: #f0f4ff;
      text-shadow: 0 0 16px rgba(255,255,255,0.5);
    }
    .hf-success-sub {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.28);
    }
  </style>
</head>
<body class="is-dormant">

  <video autoplay muted loop playsinline id="bg-video">
    <source src="assets/bg.mp4" type="video/mp4" />
  </video>

  <div class="overlay"></div>

  <audio id="bg-music" loop>
    <source src="assets/music.mp3" type="audio/mpeg">
  </audio>

  <!-- THE TERMINAL — the startup sequence, written in glyphs -->
  <div class="term" id="term">
    <div class="term-mark is-noise" id="term-mark">STARS*</div>

    <div class="term-rule"></div>
    <div class="term-log" id="term-log"></div>
    <div class="term-rule"></div>

    <div class="term-foot">
      <span id="foot-l"></span>
      <span id="foot-r"></span>
    </div>

    <!-- DORMANT: the invitation -->
    <div class="invite" id="invite">
      <span class="invite-text">Touch to Begin</span>
      <span class="invite-sub">Sound On · Headphones Recommended</span>
    </div>

    <!-- LIVE: the threshold -->
    <div class="hud" id="hud">
      <button id="enter-btn">Enter</button>
    </div>
  </div>

  <div class="flash"></div>

  <!-- HELP BUTTON -->
  <button class="help-btn" id="help-btn" aria-label="Early access">?</button>

  <!-- HELP / EARLY ACCESS FORM OVERLAY -->
  <!-- Netlify form detected at deploy time via data-netlify attribute -->
  <div class="help-overlay" id="help-overlay">
    <div class="help-panel">
      <span class="hframe tl"></span>
      <span class="hframe tr"></span>
      <span class="hframe bl"></span>
      <span class="hframe br"></span>

      <div class="hf-status-row">
        <span class="hf-status-dot"></span>
        <span class="hf-status-text">Awaiting Input</span>
      </div>
      <span class="help-label">Access List</span>
      <p class="help-tagline">Early Access Codes · Exclusive Products · And More</p>

      <!-- Success state -->
      <div class="hf-success" id="hf-success">
        <div class="hf-success-icon">✦</div>
        <div class="hf-success-title">You're on the List</div>
        <div class="hf-success-sub">Watch your inbox.</div>
      </div>

      <!-- Netlify form -->
      <form id="help-form" name="early-access" data-netlify="true"
            style="width:100%;display:flex;flex-direction:column;gap:14px;">
        <input type="hidden" name="form-name" value="early-access">

        <div class="hf-wrap">
          <input class="hf-input" type="text" name="name"
                 placeholder="Your Name" required>
        </div>
        <div class="hf-wrap">
          <input class="hf-input" type="email" name="email"
                 placeholder="Your Email Address" required>
        </div>

        <button class="hf-submit" type="submit">Request Access</button>
      </form>

      <button class="hf-close" id="hf-close">[ Close ]</button>
    </div>
  </div>

  <script src="analytics.js"></script>
  <script src="scramble.js"></script>
  <script>
  /* ════════════════════════════════════════
     STARTUP
     Nothing here is drawn — it is typed.
     Every value arrives as noise and decrypts
     into itself, on the same engine the
     archive runs (scramble.js). The music
     drives how hard the glyphs churn, and the
     signal row is the spectrum, in characters.
  ════════════════════════════════════════ */
  const body   = document.body;
  const music  = document.getElementById('bg-music');
  const markEl = document.getElementById('term-mark');
  const logEl  = document.getElementById('term-log');
  const footL  = document.getElementById('foot-l');
  const footR  = document.getElementById('foot-r');
  const enterBtn = document.getElementById('enter-btn');
  const helpOverlay = document.getElementById('help-overlay');

  const REDUCE = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  let state = 'dormant';   /* dormant → live → exiting */

  /* ── Value noise — keeps the meter alive when there's no Web Audio ── */
  function hash(n) { const s = Math.sin(n) * 43758.5453123; return s - Math.floor(s); }
  function noise(x) {
    const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f);
    return hash(i) * (1 - u) + hash(i + 1) * u;
  }

  /* ── Audio graph (built inside the activating gesture) ── */
  let audioCtx = null, analyser = null, freq = null, gain = null;
  function initAudio() {
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) { music.volume = 0.5; return; }
      audioCtx = new AC();
      const src = audioCtx.createMediaElementSource(music);
      analyser  = audioCtx.createAnalyser();
      analyser.fftSize = 512;
      analyser.smoothingTimeConstant = 0.8;
      gain = audioCtx.createGain();
      gain.gain.value = 0.0001;
      src.connect(analyser);
      analyser.connect(gain);
      gain.connect(audioCtx.destination);
      freq = new Uint8Array(analyser.frequencyBinCount);
      audioCtx.resume();
      /* slow bloom-in of the sound */
      gain.gain.exponentialRampToValueAtTime(0.75, audioCtx.currentTime + 2.6);
    } catch (e) {
      analyser = null;
      music.volume = 0.5;
    }
  }

  /* ════════════════════════════════════════
     THE LOG
     Five systems. Four of them answer; the
     fifth is the music and never settles.
  ════════════════════════════════════════ */
  const ROWS = [
    { k: 'Boot',         v: 'OK'       },
    { k: 'Audio',        v: 'LIVE'     },
    { k: 'Environment',  v: 'RENDERED' },
    { k: 'Archive Link', v: 'OPEN'     },
    { k: 'Signal',       v: null, meter: true }
  ];

  ROWS.forEach(r => {
    const row = document.createElement('div');
    row.className = 'row';
    const k = document.createElement('span'); k.className = 'row-k';
    const d = document.createElement('span'); d.className = 'row-dots';
    d.textContent = '·'.repeat(80);
    const v = document.createElement('span');
    v.className = 'row-v' + (r.meter ? ' is-meter' : ' is-pending');
    row.append(k, d, v);
    logEl.appendChild(row);
    r.el = row; r.kEl = k; r.vEl = v;
  });

  /* ── The spectrum, drawn in blocks ── */
  const BLOCKS  = '▁▂▃▄▅▆▇█';
  const METER_N = 16;
  const level   = new Float32Array(METER_N);
  const meterEl = ROWS[ROWS.length - 1].vEl;

  let energy = 0, bass = 0, bassAvg = 0, lastBeat = 0, T = 0, lastT = performance.now();

  function readAudio() {
    if (analyser) {
      analyser.getByteFrequencyData(freq);
      const n = freq.length;
      const bEnd = Math.floor(n * 0.08);
      let b = 0, all = 0;
      for (let i = 0; i < bEnd; i++) b += freq[i];
      for (let i = 0; i < n;    i++) all += freq[i];
      bass   = b / (bEnd * 255);
      energy = all / (n * 255);
    } else {
      bass   = 0.14 + 0.10 * Math.sin(T * 2.6);
      energy = 0.12 + 0.08 * noise(T * 0.7);
    }
  }

  function drawMeter() {
    let out = '';
    for (let i = 0; i < METER_N; i++) {
      const m = i / (METER_N - 1);
      let f;
      if (analyser) {
        /* the top of the spectrum is always quieter — tilt it back up */
        const raw = freq[Math.floor(m * (freq.length - 1) * 0.62)] / 255;
        f = Math.min(1, Math.pow(raw, 0.8) * (0.85 + 1.3 * m));
      } else {
        f = 0.18 + 0.42 * noise(m * 4.5 + T * 1.6);
      }
      level[i] += (f - level[i]) * 0.3;
      out += BLOCKS[Math.min(BLOCKS.length - 1, Math.round(level[i] * (BLOCKS.length - 1)))];
    }
    meterEl.textContent = out;
  }

  function tick(now) {
    const dt = Math.min((now - lastT) / 1000, 0.05);
    lastT = now; T += dt;

    if (state === 'live') {
      readAudio();
      /* the whole site's scrambling churns harder on the loud passages */
      Scramble.energy = Math.min(1, energy * 1.6);
      drawMeter();

      /* a beat pushes the caret */
      bassAvg += (bass - bassAvg) * 0.06;
      if (bass > bassAvg * 1.4 && bass > 0.2 && now - lastBeat > 420) {
        lastBeat = now;
        footL.classList.add('hit');
        setTimeout(() => footL.classList.remove('hit'), 130);
      }
    }
    raf = requestAnimationFrame(tick);
  }
  let raf = requestAnimationFrame(tick);

  /* Don't burn cycles in a hidden tab */
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      cancelAnimationFrame(raf);
    } else {
      lastT = performance.now();
      raf = requestAnimationFrame(tick);
    }
  });

  /* ════════════════════════════════════════
     DORMANT — the mark is still encrypted
  ════════════════════════════════════════ */
  const markNoise = new Decrypt(markEl, 'STARS*', 'eternal');
  markNoise.start();

  footL.innerHTML = '<span class="caret">▮</span> Dormant';
  /* Which node you're on is never stated. It scrambles and never resolves —
     the archive refuses to give its size the same way. */
  footR.textContent = 'Node ';
  const nodeEl = document.createElement('span');
  nodeEl.className = 'node-id';
  footR.appendChild(nodeEl);
  new Decrypt(nodeEl, '########', 'eternal').start();

  /* ════════════════════════════════════════
     ACTIVATION — the first gesture boots it
  ════════════════════════════════════════ */
  function activate() {
    if (state !== 'dormant') return;
    state = 'live';
    body.classList.remove('is-dormant');
    body.classList.add('is-live');

    initAudio();
    music.play().catch(() => {});

    /* the mark stops churning and resolves into itself */
    markNoise.stop();
    markEl.classList.remove('is-noise');
    scrambleTo(markEl, 'STARS*');

    const step = REDUCE ? 90 : 520;
    ROWS.forEach((r, i) => setTimeout(() => {
      if (state === 'exiting') return;
      r.el.classList.add('in');
      scrambleTo(r.kEl, r.k.toUpperCase(), () => {
        if (r.meter) return;                    /* the signal answers in blocks */
        r.vEl.classList.remove('is-pending');
        scrambleTo(r.vEl, r.v);
      });
    }, 380 + i * step));

    setTimeout(() => {
      if (state !== 'live') return;
      footL.innerHTML = '<span class="caret">▮</span> Awaiting Entry';
      startResync();
    }, 380 + ROWS.length * step);

    /* Hold the threshold back so the sequence is actually watched.
       Long enough that the boot reads as a boot, short enough that
       it is never the reason someone leaves. Tune here. */
    const HOLD_MS = 1800;
    setTimeout(() => body.classList.add('can-enter'), REDUCE ? 600 : HOLD_MS);
  }

  /* ════════════════════════════════════════
     RESYNC — the standing drama.
     Every few seconds one line loses its
     footing and has to decrypt itself again.
  ════════════════════════════════════════ */
  let resyncTimer = null;
  function startResync() {
    const next = () => {
      resyncTimer = setTimeout(() => {
        if (state !== 'live') return;
        if (Math.random() < 0.25) {
          /* the mark itself slips */
          scrambleTo(markEl, 'STARS*');
        } else {
          const pool = ROWS.filter(r => !r.meter);
          const r = pool[(Math.random() * pool.length) | 0];
          scrambleTo(r.vEl, r.v);
        }
        next();
      }, 5200 + Math.random() * 5200);
    };
    if (!REDUCE) next();
  }

  ['pointerdown', 'touchstart', 'keydown'].forEach(evt =>
    document.addEventListener(evt, activate, { passive: true })
  );

  /* ════════════════════════════════════════
     THRESHOLD
  ════════════════════════════════════════ */
  function enterSite() {
    if (state !== 'live' || !body.classList.contains('can-enter')) return;
    state = 'exiting';
    body.classList.add('is-exiting');

    /* Hand the music across to /home so it doesn't restart */
    try { sessionStorage.setItem('stars_audio_t', String(music.currentTime)); } catch (e) {}
    /* Remember the crossing — the head script reads this and lets a
       returning visitor straight through for the next week. */
    try { localStorage.setItem('stars_crossed', String(Date.now())); } catch (e) {}

    /* Everything it just told you comes apart on the way out */
    clearTimeout(resyncTimer);
    killDecrypts();
    footL.innerHTML = '<span class="caret">▮</span> Crossing';
    ROWS.forEach(r => {
      if (r.meter) return;
      new Decrypt(r.vEl, r.v, 'eternal').start();
    });
    new Decrypt(markEl, 'STARS*', 'eternal').start();

    if (gain && audioCtx) {
      try { gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.85); } catch (e) {}
    }
    /* long enough that the log is seen coming apart before the black lands */
    setTimeout(() => { window.location.href = '/home'; }, 1150);
  }

  enterBtn.addEventListener('click', enterSite);

  document.addEventListener('keydown', e => {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    /* Never steal the key from the access-list form */
    if (helpOverlay.classList.contains('active')) return;
    if (['INPUT', 'TEXTAREA', 'SELECT'].includes(e.target.tagName)) return;
    if (body.classList.contains('can-enter')) { e.preventDefault(); enterSite(); }
  });

  /* ════════════════════════════════════════
     HELP / EARLY ACCESS
  ════════════════════════════════════════ */
  function openHelp()  { helpOverlay.classList.add('active'); }
  function closeHelp() {
    helpOverlay.classList.remove('active');
    /* Release focus — otherwise it stays trapped in the hidden form and the
       next Enter fires that form's validation instead of the threshold. */
    if (document.activeElement && helpOverlay.contains(document.activeElement)) {
      document.activeElement.blur();
    }
    setTimeout(() => {
      const f = document.getElementById('help-form');
      const s = document.getElementById('hf-success');
      if (f) { f.reset(); f.style.display = ''; }
      if (s) s.style.display = '';
    }, 400);
  }

  document.getElementById('help-btn').addEventListener('click', openHelp);
  document.getElementById('hf-close').addEventListener('click', closeHelp);
  helpOverlay.addEventListener('click', e => {
    if (!e.target.closest('.help-panel')) closeHelp();
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeHelp();
  });

  document.getElementById('help-form').addEventListener('submit', async e => {
    e.preventDefault();
    try {
      await fetch('/', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: new URLSearchParams(new FormData(e.target)).toString()
      });
    } catch (err) { /* proceeds to success state on live Netlify site */ }
    e.target.style.display = 'none';
    document.getElementById('hf-success').style.display = 'flex';
    setTimeout(closeHelp, 3200);
  });
  </script>
</body>
</html>
